name: ApexUninstaller
options:
  bundleIdPrefix: com.haidv
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  DirectDebug: debug
  Release: release
  DirectRelease: release

settings:
  base:
    GENERATE_INFOPLIST_FILE: false

schemes:
  ApexUninstaller:
    build:
      targets:
        ApexUninstaller: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ApexUninstallerTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  ApexUninstaller-Direct:
    build:
      targets:
        ApexUninstaller: all
    run:
      config: DirectDebug
    test:
      config: DirectDebug
      targets:
        - ApexUninstallerTests
    profile:
      config: DirectRelease
    analyze:
      config: DirectDebug
    archive:
      config: DirectRelease

targets:
  ApexUninstaller:
    type: application
    platform: macOS
    sources:
      - path: ApexUninstaller
        excludes:
          - "Resources/AppIcon.png"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.haidv.apexuninstaller
        PRODUCT_NAME: ApexUninstaller
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "11"
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        INFOPLIST_FILE: ApexUninstaller/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        ENABLE_PREVIEWS: true
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: ApexUninstaller/ApexUninstaller.debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: ApexUninstaller/ApexUninstaller.entitlements
          DEVELOPMENT_TEAM: 84253AGHK5
        DirectDebug:
          CODE_SIGN_ENTITLEMENTS: ApexUninstaller/ApexUninstaller.direct.entitlements
          ENABLE_HARDENED_RUNTIME: true
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DIRECT_DISTRIBUTION"
        DirectRelease:
          CODE_SIGN_ENTITLEMENTS: ApexUninstaller/ApexUninstaller.direct.entitlements
          DEVELOPMENT_TEAM: 84253AGHK5
          ENABLE_HARDENED_RUNTIME: true
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DIRECT_DISTRIBUTION"

  ApexUninstallerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ApexUninstallerTests
    dependencies:
      - target: ApexUninstaller
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.haidv.apexuninstaller.tests
        PRODUCT_NAME: ApexUninstallerTests
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: true
